name: Release Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to rebuild and publish
        required: true
        type: string

# Only one release build per tag/ref at a time; don't cancel in-flight
# release builds since they may already be uploading artifacts.
concurrency:
  group: release-desktop-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build (${{ matrix.platform }})
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: single universal binary covering Apple Silicon + Intel.
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Install both macOS arches so the universal build can link them.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo registry & target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/studio/src-tauri

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            libxdo-dev \
            libasound2-dev \
            libayatana-appindicator3-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Point at the Tauri app inside the monorepo so it builds apps/studio.
          # tauri-action runs the tauri.conf.json beforeBuildCommand (pnpm build)
          # to build the frontend (apps/studio/dist) before bundling.
          projectPath: apps/studio
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'Dubnator ${{ inputs.tag || github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish-release:
    name: Publish release
    needs: build-desktop
    if: needs.build-desktop.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Publish completed draft
        shell: bash
        run: |
          notes_file="docs/releases/${RELEASE_TAG}.md"
          args=(
            "$RELEASE_TAG"
            --repo "$GITHUB_REPOSITORY"
            --title "Dubnator $RELEASE_TAG"
            --draft=false
            --latest
          )
          if [[ -f "$notes_file" ]]; then
            args+=(--notes-file "$notes_file")
          fi
          gh release edit "${args[@]}"
