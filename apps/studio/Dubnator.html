  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="app.jsx?v=19"></script>
  <script>
    // Fill the viewport WIDTH (the rack scrolls vertically if it's taller than
    // the window). A scale() is always present so position:fixed still resolves
    // against the chassis (the app relies on that for floating windows).
    function fitChassis() {
      const c = document.querySelector('.chassis');
      if (!c) return;
      // Fill the full browser width. The rack scrolls vertically when it is
      // taller than the window (use the Full Screen control / key 0 to gain
      // height). Only scale DOWN when the window is narrower than the rack;
      // reclaim the freed space with a negative margin so no phantom scroll.
      const scale = Math.min(window.innerWidth / c.offsetWidth, 1);
      c.style.transformOrigin = 'top center';
      c.style.transform = `scale(${scale})`;
      c.style.marginBottom = (c.offsetHeight * (scale - 1)) + 'px';
      document.body.style.height = '';
    }
    window.addEventListener('resize', fitChassis);
    new MutationObserver(fitChassis).observe(document.body, { childList: true, subtree: true });
    setInterval(fitChassis, 500);
  </script>
</body>
</html>
