[package]
name = "dubnator"
version = "0.3.0"
description = "Dubnator Mk-1 — brutalist dub FX rack"
edition = "2021"
rust-version = "1.77"

[lib]
name = "dubnator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
# Native MIDI input: WKWebView (macOS) and WebKitGTK (Linux) have no Web MIDI,
# so the desktop app reads controllers via CoreMIDI/ALSA/WinMM through midir
# and forwards raw messages to the webview as "midi" events.
midir = "0.10"
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
